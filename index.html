<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d0b10">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="description" content="Nexo — espacio privado para gestionar una dinámica compartida.">
  <title>Nexo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0d0b10;
      color: #f3eef5;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .app {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 42px 28px;
      border: 1px solid #302b35;
      border-radius: 24px;
      background: #151219;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }

    .logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 22px;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #211c26;
      border: 1px solid #3a3340;
      font-size: 30px;
      font-weight: 700;
    }

    h1 {
      margin: 0;
      font-size: 38px;
      letter-spacing: -1px;
    }

    p {
      margin: 12px 0 30px;
      color: #aaa2ae;
      line-height: 1.5;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 15px;
      background: #f0e8f2;
      color: #17131a;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:active {
      transform: scale(.98);
    }

    .version {
      margin-top: 24px;
      font-size: 12px;
      color: #716a75;
    }
  </style>
</head>

<body>

  <main class="app">
    <section class="card">
      <div class="logo">N</div>

      <h1>Nexo</h1>

      <p>
        Un espacio privado para compartir,
        gestionar y desarrollar vuestra dinámica.
      </p>

      <button onclick="entrar()">
        Entrar
      </button>

      <div class="version">
        Nexo · v0.1
      </div>
    </section>
  </main>

  <script>
    function entrar() {
      alert("Nexo está en construcción.");
    }
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js");
    }
  </script>

</body>
</html>
