<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d0b10">
  <meta name="description" content="Un espacio privado.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Nexo">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Nexo</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #0d0b10;
      color: #f3eef5;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .app {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      padding: 42px 28px;
      border: 1px solid #302b35;
      border-radius: 24px;
      background: #151219;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }
    .logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 22px;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #211c26;
      border: 1px solid #3a3340;
      font-size: 30px;
      font-weight: 700;
    }
    h1 { margin: 0; font-size: 38px; letter-spacing: -1px; }
    .intro { margin: 12px 0 30px; color: #aaa2ae; line-height: 1.5; }
    button {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 15px;
      background: #f0e8f2;
      color: #17131a;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    button:active { transform: scale(.98); }
    button:focus-visible { outline: 3px solid #c6a7ff; outline-offset: 3px; }
    button.secondary {
      margin-top: 12px;
      background: #29232f;
      color: #f3eef5;
      border: 1px solid #403847;
    }
    button[hidden] { display: none; }
    .connection-status {
      margin: 18px 0 0;
      font-size: 13px;
      color: #aaa2ae;
    }
    .connection-status::before {
      content: "";
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-right: 8px;
      border-radius: 50%;
      background: #67c587;
      vertical-align: 1px;
    }
    .connection-status.is-offline::before { background: #e4a654; }
    .version { margin-top: 24px; font-size: 12px; color: #716a75; }
    @media (max-width: 360px) {
      .card { padding: 34px 22px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="card" aria-labelledby="app-title">
      <div class="logo" aria-hidden="true">N</div>
      <h1 id="app-title">Nexo</h1>
      <p class="intro">Un espacio privado.</p>
      <button type="button" onclick="entrar()">Entrar</button>
      <button id="install-button" class="secondary" type="button" hidden>Instalar Nexo</button>
      <p id="connection-status" class="connection-status" role="status" aria-live="polite"></p>
      <div class="version">Nexo · v0.2</div>
    </section>
  </main>
  <script>
    let installPrompt = null;
    const installButton = document.getElementById("install-button");
    const connectionStatus = document.getElementById("connection-status");
    const isAppleMobile = /iphone|ipad|ipod/i.test(navigator.userAgent) ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    const isInstalled = window.matchMedia("(display-mode: standalone)").matches ||
      navigator.standalone === true;

    function entrar() {
      alert("Nexo está en construcción.");
    }

    function updateConnectionStatus() {
      const isOnline = navigator.onLine;
      connectionStatus.textContent = isOnline
        ? "Con conexión"
        : "Sin conexión · Nexo seguirá disponible";
      connectionStatus.classList.toggle("is-offline", !isOnline);
    }

    updateConnectionStatus();
    window.addEventListener("online", updateConnectionStatus);
    window.addEventListener("offline", updateConnectionStatus);

    if (isAppleMobile && !isInstalled) installButton.hidden = false;

    window.addEventListener("beforeinstallprompt", (event) => {
      event.preventDefault();
      installPrompt = event;
      installButton.hidden = isInstalled;
    });

    window.addEventListener("appinstalled", () => {
      installPrompt = null;
      installButton.hidden = true;
      connectionStatus.textContent = "Nexo está instalado";
    });

    installButton.addEventListener("click", async () => {
      if (installPrompt) {
        installPrompt.prompt();
        await installPrompt.userChoice;
        installPrompt = null;
        installButton.hidden = true;
      } else if (isAppleMobile) {
        alert("Para instalar Nexo, pulsa Compartir y luego “Añadir a pantalla de inicio”.");
      }
    });

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch((error) => {
        console.error("No se pudo registrar el service worker:", error);
      });
    }
  </script>
</body>
</html>
