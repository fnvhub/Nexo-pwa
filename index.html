<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d0b10">
  <meta name="description" content="Un espacio privado.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Nexo">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Nexo</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: #0d0b10; color: #f3eef5;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .app {
      min-height: 100vh; display: flex; align-items: center;
      justify-content: center; padding: 24px;
    }
    .card, .app-shell {
      width: 100%; max-width: 520px; padding: 36px 28px;
      border: 1px solid #302b35; border-radius: 24px;
      background: #151219; box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }
    .card { max-width: 420px; text-align: center; }
    .logo {
      width: 72px; height: 72px; margin: 0 auto 22px;
      border-radius: 22px; display: flex; align-items: center;
      justify-content: center; background: #211c26;
      border: 1px solid #3a3340; font-size: 30px; font-weight: 700;
    }
    h1 { margin: 0; font-size: 38px; letter-spacing: -1px; }
    .intro { margin: 12px 0 30px; color: #aaa2ae; line-height: 1.5; }
    button {
      width: 100%; border: 0; border-radius: 14px; padding: 15px;
      background: #f0e8f2; color: #17131a; font-size: 16px;
      font-weight: 700; cursor: pointer;
    }
    button:active { transform: scale(.98); }
    button:focus-visible { outline: 3px solid #c6a7ff; outline-offset: 3px; }
    button.secondary {
      margin-top: 12px; background: #29232f; color: #f3eef5;
      border: 1px solid #403847;
    }
    button[hidden] { display: none; }
    .connection-status { margin: 18px 0 0; font-size: 13px; color: #aaa2ae; }
    .connection-status::before {
      content: ""; display: inline-block; width: 8px; height: 8px;
      margin-right: 8px; border-radius: 50%; background: #67c587;
      vertical-align: 1px;
    }
    .connection-status.is-offline::before { background: #e4a654; }
    .app-shell { max-width: 620px; }
    .app-header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; margin-bottom: 34px;
    }
    .app-brand { display: flex; align-items: center; gap: 12px; font-size: 19px; }
    .app-brand .logo { width: 42px; height: 42px; margin: 0; border-radius: 14px; font-size: 19px; }
    .settings-button { width: auto; padding: 11px 16px; }
    .workspace-content {
      min-height: 220px; padding: 26px; border: 1px solid #302b35;
      border-radius: 18px; background: #201b25;
    }
    .workspace-content h1 { font-size: 26px; letter-spacing: -.4px; }
    .workspace-content p { color: #aaa2ae; line-height: 1.55; }
    .workspace-actions { margin-top: 28px; }
    dialog {
      width: min(92vw, 460px); max-height: 82vh; overflow: auto;
      padding: 26px; border: 1px solid #403847; border-radius: 20px;
      background: #151219; color: #f3eef5;
      box-shadow: 0 20px 70px rgba(0,0,0,.55);
    }
    dialog::backdrop { background: rgba(0,0,0,.72); }
    dialog h2 { margin: 0 0 8px; }
    dialog h3 { margin: 24px 0 12px; font-size: 15px; }
    .settings-version { margin: 0; color: #aaa2ae; font-size: 14px; }
    .update-list { display: grid; gap: 10px; padding-left: 22px; }
    .update-list li {
      padding: 12px; border: 1px solid #302b35;
      border-radius: 12px; background: #201b25;
    }
    .update-list strong { display: block; margin-bottom: 4px; }
    .update-list time { color: #aaa2ae; font-size: 12px; }
    .update-list p { margin: 8px 0 0; color: #d3ccd8; font-size: 14px; line-height: 1.45; }
    dialog form { margin-top: 18px; }
    @media (max-width: 420px) {
      .card, .app-shell { padding: 30px 22px; }
      dialog { padding: 20px; }
      .app-header { margin-bottom: 24px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section id="welcome-screen" class="card" aria-labelledby="app-title">
      <div class="logo" aria-hidden="true">N</div>
      <h1 id="app-title">Nexo</h1>
      <p class="intro">Un espacio privado.</p>
      <button id="enter-button" type="button">Entrar</button>
      <button id="install-button" class="secondary" type="button" hidden>Instalar Nexo</button>
      <p id="connection-status" class="connection-status" role="status" aria-live="polite"></p>
    </section>

    <section id="app-screen" class="app-shell" aria-labelledby="workspace-title" hidden>
      <header class="app-header">
        <div class="app-brand"><span class="logo" aria-hidden="true">N</span><span>Nexo</span></div>
        <button id="settings-button" class="secondary settings-button" type="button">Ajustes</button>
      </header>
      <section class="workspace-content">
        <h1 id="workspace-title">Tu espacio privado</h1>
        <p>Has entrado en Nexo. Este espacio será el punto de encuentro de la aplicación.</p>
        <div class="workspace-actions">
          <button id="leave-button" class="secondary" type="button">Volver a la portada</button>
        </div>
      </section>
      <p id="app-connection-status" class="connection-status" role="status" aria-live="polite"></p>
    </section>
  </main>

  <dialog id="settings-dialog" aria-labelledby="settings-title">
    <h2 id="settings-title">Ajustes</h2>
    <p id="settings-version" class="settings-version"></p>
    <h3>Últimas actualizaciones</h3>
    <ol id="update-history" class="update-list"></ol>
    <form method="dialog"><button class="secondary" type="submit">Cerrar</button></form>
  </dialog>

  <script>
    const APP_VERSION = "0.3.1";
    const RELEASE_HISTORY = [
      { version: "0.3.1", date: "2026-10-25", note: "Ajustes y versión se muestran dentro de la aplicación." },
      { version: "0.3.0", date: "2026-10-25", note: "Se añadieron ajustes e historial de versiones." },
      { version: "0.2.1", date: "2026-10-25", note: "Se simplificó el texto de portada." },
      { version: "0.2.0", date: "2026-10-25", note: "Instalación PWA, estado de conexión y soporte sin conexión." },
      { version: "0.1.0", date: "2026-10-25", note: "Primera versión de la portada de Nexo." }
    ].slice(0, 10);

    let installPrompt = null;
    const welcomeScreen = document.getElementById("welcome-screen");
    const appScreen = document.getElementById("app-screen");
    const enterButton = document.getElementById("enter-button");
    const leaveButton = document.getElementById("leave-button");
    const installButton = document.getElementById("install-button");
    const settingsButton = document.getElementById("settings-button");
    const settingsDialog = document.getElementById("settings-dialog");
    const isAppleMobile = /iphone|ipad|ipod/i.test(navigator.userAgent) ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    const isInstalled = window.matchMedia("(display-mode: standalone)").matches ||
      navigator.standalone === true;

    function updateConnectionStatus() {
      const text = navigator.onLine ? "Con conexión" : "Sin conexión";
      document.getElementById("connection-status").textContent = text;
      document.getElementById("app-connection-status").textContent = text;
      document.getElementById("connection-status").classList.toggle("is-offline", !navigator.onLine);
      document.getElementById("app-connection-status").classList.toggle("is-offline", !navigator.onLine);
    }

    enterButton.addEventListener("click", () => {
      welcomeScreen.hidden = true;
      appScreen.hidden = false;
      window.scrollTo(0, 0);
    });

    leaveButton.addEventListener("click", () => {
      appScreen.hidden = true;
      welcomeScreen.hidden = false;
      window.scrollTo(0, 0);
    });

    settingsButton.addEventListener("click", () => {
      document.getElementById("settings-version").textContent = "Versión " + APP_VERSION;
      const historyList = document.getElementById("update-history");
      historyList.replaceChildren();
      RELEASE_HISTORY.forEach((update) => {
        const item = document.createElement("li");
        const heading = document.createElement("strong");
        heading.textContent = "v" + update.version;
        const date = document.createElement("time");
        date.dateTime = update.date;
        date.textContent = new Intl.DateTimeFormat("es", {
          day: "numeric", month: "short", year: "numeric", timeZone: "UTC"
        }).format(new Date(update.date + "T12:00:00Z"));
        const note = document.createElement("p");
        note.textContent = update.note;
        item.append(heading, date, note);
        historyList.append(item);
      });
      settingsDialog.showModal();
    });

    updateConnectionStatus();
    window.addEventListener("online", updateConnectionStatus);
    window.addEventListener("offline", updateConnectionStatus);
    if (isAppleMobile && !isInstalled) installButton.hidden = false;
    window.addEventListener("beforeinstallprompt", (event) => {
      event.preventDefault();
      installPrompt = event;
      installButton.hidden = isInstalled;
    });
    window.addEventListener("appinstalled", () => {
      installPrompt = null;
      installButton.hidden = true;
    });
    installButton.addEventListener("click", async () => {
      if (installPrompt) {
        installPrompt.prompt();
        await installPrompt.userChoice;
        installPrompt = null;
        installButton.hidden = true;
      } else if (isAppleMobile) {
        alert("Para instalar Nexo, pulsa Compartir y luego “Añadir a pantalla de inicio”.");
      }
    });
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch((error) => {
        console.error("No se pudo registrar el service worker:", error);
      });
    }
  </script>
</body>
</html>
